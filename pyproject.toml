[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-qa"
version = "1.0.0"
description = "Multi-Agent Security Policy Q&A: exploring Microsoft Agent Framework, backed by Azure AI Search and Azure OpenAI"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-openai>=1.10.0,<2",
    "azure-search-documents>=12.0.0,<13",
    "azure-identity>=1.17",
    "openai>=1.60",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
policy-qa = "policy_qa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policy_qa = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
